<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Shield Base Glow -->
  <path d="M 256 80 L 380 144 C 380 270 326 368 256 424 C 186 368 132 270 132 144 Z"
        fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.95"/>

  <!-- Inner Shield Core -->
  <path d="M 256 108 L 356 160 C 356 262 312 344 256 392 C 200 344 156 262 156 160 Z"
        fill="#0f172a" opacity="0.88"/>

  <!-- Guardian Heart / Mentor Wings -->
  <path d="M 256 170 L 320 234 C 340 254 340 286 320 306 C 300 326 270 326 256 312 C 242 326 212 326 192 306 C 172 286 172 254 192 234 Z"
        fill="url(#shieldGrad)"/>

  <!-- Center Safe Sparkle / Star of Guidance -->
  <circle cx="256" cy="245" r="14" fill="#ffffff" filter="url(#glow)"/>
  <path d="M 256 215 L 260 239 L 284 245 L 260 251 L 256 275 L 252 251 L 228 245 L 252 239 Z" fill="#ffffff"/>

  <!-- Android Guardian AI Text / Tag -->
  <text x="256" y="475" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="4">RINAYA</text>
</svg>
